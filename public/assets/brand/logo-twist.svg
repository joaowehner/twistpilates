<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#552277"/>
      <stop offset="100%" stop-color="#3b1354"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9bd444"/>
      <stop offset="100%" stop-color="#7ab728"/>
    </linearGradient>
  </defs>

  <!-- Diamond Background Container -->
  <g transform="translate(200, 180)">
    <rect x="-135" y="-135" width="270" height="270" rx="28" transform="rotate(45)" fill="url(#purpleGrad)"/>
    <rect x="-135" y="-135" width="270" height="270" rx="28" transform="rotate(45)" fill="none" stroke="url(#greenGrad)" stroke-width="6" opacity="0.9"/>
    
    <!-- Stylized Warrior Pose Silhouette in Lime Green -->
    <!-- Head and Bun -->
    <circle cx="2" cy="-68" r="9" fill="#9bd444"/>
    <ellipse cx="6" cy="-75" rx="5" ry="4.5" fill="#9bd444"/>
    
    <!-- Neck and Torso -->
    <path d="M-2 -58 C-1 -54, -2 -42, -5 -25 C-7 -10, -5 2, 2 8 C9 2, 8 -12, 6 -26 C4 -42, 5 -54, 6 -58 Z" fill="#9bd444"/>
    
    <!-- Outstretched Arms (Left & Right Horizon Balance) -->
    <!-- Left Arm -->
    <path d="M-4 -48 C-25 -50, -58 -52, -88 -50 C-94 -50, -96 -44, -90 -44 C-60 -45, -28 -42, -5 -40 Z" fill="#9bd444"/>
    <!-- Right Arm -->
    <path d="M5 -48 C28 -50, 62 -52, 92 -50 C98 -50, 100 -44, 94 -44 C64 -45, 32 -42, 6 -40 Z" fill="#9bd444"/>
    
    <!-- Pelvis and Legs -->
    <!-- Front Lunge Leg (Bending Left) -->
    <path d="M-5 4 C-16 12, -32 24, -46 36 C-52 42, -54 52, -54 62 C-54 68, -46 72, -42 66 C-42 56, -42 46, -34 38 C-24 28, -12 18, 0 10 Z" fill="#9bd444"/>
    <!-- Front Foot -->
    <path d="M-56 64 C-64 65, -74 65, -78 69 C-76 72, -60 72, -44 70 C-46 66, -50 64, -56 64 Z" fill="#9bd444"/>
    
    <!-- Back Extended Leg (Stretching Right) -->
    <path d="M2 8 C18 16, 40 28, 62 42 C74 50, 85 58, 98 66 C104 70, 108 66, 104 62 C90 52, 78 44, 66 34 C44 20, 22 10, 0 5 Z" fill="#9bd444"/>
    <!-- Back Pointed Foot -->
    <path d="M98 65 C105 70, 114 74, 118 78 C115 80, 106 76, 96 70 Z" fill="#9bd444"/>
  </g>

  <!-- Brand Typography -->
  <text x="200" y="382" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="7" fill="#3B1354">TWIST</text>
  <text x="200" y="420" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="20" letter-spacing="11" fill="#7AB728">PILATES</text>
</svg>
